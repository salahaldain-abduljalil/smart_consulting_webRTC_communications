version: '3.8'

services:
  mediasoup:
    build: .
    container_name: mediasoup-sfu
    restart: unless-stopped
    ports:
      - "4000:4000" # signalling WS
      - "10000-10100:10000-10100/udp" # mediasoup RTP ports
    environment:
      - SFU_SECRET=${SFU_SECRET}
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP}
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - WORKER_COUNT=${WORKER_COUNT:-1}
    networks:
      - sfu_net

  coturn:
    image: instrumentisto/coturn
    container_name: coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
    environment:
      - TURN_SECRET=${TURN_SECRET}
      - TURN_REALM=${TURN_REALM:-localhost}
    command: ["--no-stdout-log","--verbose","--log-file=stdout","--use-auth-secret","--static-auth-secret=${TURN_SECRET}","--realm=${TURN_REALM:-localhost}","--listening-port=3478","--min-port=49152","--max-port=65535"]
    networks:
      - sfu_net

  nginx:
    image: nginx:alpine
    container_name: sfu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - mediasoup
    networks:
      - sfu_net

networks:
  sfu_net:
    driver: bridge
